name: Test Sigstore Build Provenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-test:
    name: Sigstore Provenance Attestation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Test Artifact
        run: |
          mkdir -p dist
          echo '{"name": "x185plus-provenance-demo", "version": "1.0.0", "engine": "X185Plus Public Attestation Route"}' > dist/test-artifact.json
          sha256sum dist/test-artifact.json

      - name: Attest Build Provenance (Sigstore)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/test-artifact.json

      - name: Upload Verified Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-artifact
          path: dist/test-artifact.json
